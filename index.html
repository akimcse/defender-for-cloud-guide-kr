<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Microsoft Defender for Cloud 학습 가이드</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Microsoft Defender for Cloud 학습 코스 — CSPM · CWP · DevSecOps를 개념부터 실습까지. Microsoft Learn 공식 문서 기반." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --brand: #0f6cbd;          /* Fluent primary */
      --brand-dark: #0a4f8f;
      --brand-2: #7b61ff;
      --ink: #1b1f27;
      --ink-soft: #4a5464;
      --line: #e7ecf3;
      --line-soft: #eef2f7;
      --bg: #fbfcfe;
      --bg-code: #f5f7fb;
      --sidebar-w: 290px;
      --toc-w: 250px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    /* ---------- Left sidebar (documents only) ---------- */
    .sidebar {
      width: var(--sidebar-w);
      background: #ffffff;
      border-right: 1px solid var(--line);
      padding: 0;
    }
    .sidebar > h1 { margin: 0; padding: 26px 24px 10px; }
    .sidebar > h1 .app-name-link {
      font-size: 17px; font-weight: 800; color: var(--ink);
      display: flex; align-items: center; gap: 8px; letter-spacing: -0.02em;
    }
    .sidebar-nav { padding: 8px 14px 40px; }
    .sidebar-nav > ul > li strong,
    .sidebar-nav > ul > li > p strong {
      display: block;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #96a1b2;
      padding: 18px 10px 6px;
    }
    .sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
    .sidebar-nav li { margin: 2px 0; }
    .sidebar-nav a {
      display: block; padding: 8px 12px; border-radius: 9px;
      color: var(--ink-soft); font-size: 14.5px; font-weight: 500;
      text-decoration: none; transition: all .15s ease; border: 0; outline: none;
    }
    .sidebar-nav a:hover { background: #f1f6fc; color: var(--brand); }
    .sidebar-nav a:focus { outline: none; }
    .sidebar-nav li.active > a {
      background: linear-gradient(90deg, #eaf3fc, #f3eefe);
      color: var(--brand-dark); font-weight: 700;
      border: 0; box-shadow: none;
    }
    /* dim the "예정" placeholders */
    .sidebar-nav li em { color: #b3bccb; font-style: normal; font-size: 12px; }
    .app-name { margin: 0; }

    /* ---------- Content ---------- */
    .content { left: var(--sidebar-w); right: 0; transition: left .25s, right .25s; }
    .markdown-section {
      max-width: 820px; margin: 0 auto; padding: 34px 44px 80px;
    }
    /* Wide screens: reserve right space for the page TOC so nothing overlaps */
    @media (min-width: 1300px) {
      .content { right: var(--toc-w); }
    }

    .markdown-section h1 {
      font-size: 30px; font-weight: 800; margin: 8px 0 22px;
      letter-spacing: -0.03em; line-height: 1.25;
      padding-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .markdown-section h2 {
      font-size: 22px; font-weight: 800; margin: 46px 0 16px;
      color: var(--ink); letter-spacing: -0.02em;
      padding-bottom: 10px; border-bottom: 2px solid var(--line);
    }
    .markdown-section h2::after {
      content: ""; display: block; width: 46px; height: 3px; margin-top: 10px;
      margin-bottom: -12px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 3px;
    }
    .markdown-section h3 {
      font-size: 16.5px; font-weight: 700; margin: 28px 0 10px; color: var(--brand-dark);
    }
    .markdown-section p, .markdown-section li { line-height: 1.75; color: #2b3542; }
    .markdown-section a { color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent; }
    .markdown-section a:hover { border-bottom-color: var(--brand); }

    /* Tables */
    .markdown-section table {
      display: table; width: 100%; border-collapse: separate; border-spacing: 0;
      margin: 18px 0; border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; font-size: 14px;
    }
    .markdown-section th {
      background: #f3f7fc; color: #33465c; font-weight: 700;
      text-align: left; border: 0; border-bottom: 1px solid var(--line);
    }
    .markdown-section td { border: 0; border-bottom: 1px solid var(--line-soft); }
    .markdown-section tr:last-child td { border-bottom: 0; }
    .markdown-section tbody tr:nth-child(2n) { background: #fafcfe; }
    .markdown-section th, .markdown-section td { padding: 10px 14px; }

    /* Code */
    .markdown-section code { color: #b23a86; background: var(--bg-code); border-radius: 5px; padding: 2px 6px; font-size: 13px; }
    .markdown-section pre { background: var(--bg-code); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .markdown-section pre > code { background: transparent; color: #2b3542; }

    /* Blockquote (plain) */
    .markdown-section blockquote {
      border-left: 3px solid #cdd7e3; background: #f8fafc;
      color: #55617180; color: #556171; margin: 16px 0; padding: 6px 18px; border-radius: 0 8px 8px 0;
    }
    .markdown-section blockquote p { color: #556171; }

    /* ---------- GitHub-style callouts ---------- */
    .alert { border: 1px solid; border-left-width: 4px; border-radius: 10px; padding: 14px 18px; margin: 18px 0; }
    .alert p:first-child { margin-top: 0; }
    .alert p:last-child { margin-bottom: 0; }
    .alert .label { font-weight: 800; font-size: 13px; letter-spacing: -0.01em; margin-bottom: 6px; display: block; }
    .alert.note { border-color: #b6d8f5; background: #eff6fc; }
    .alert.note .label { color: #0f6cbd; }
    .alert.tip { border-color: #b6e3c4; background: #eefaf1; }
    .alert.tip .label { color: #1a7f37; }
    .alert.important { border-color: #d6c6ff; background: #f4efff; }
    .alert.important .label { color: #6b3ff0; }
    .alert.warning { border-color: #f2d9a6; background: #fff8ea; }
    .alert.warning .label { color: #9a6700; }
    .alert.caution { border-color: #f5b9be; background: #fdeef0; }
    .alert.caution .label { color: #cf222e; }

    /* status badges */
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; }
    .badge.ga { background:#e4f5e9; color:#1a7f37; }
    .badge.preview { background:#fff0d4; color:#8a5a00; }

    /* Mermaid */
    .mermaid { text-align: center; margin: 22px 0; }
    .mermaid svg { max-width: 100%; height: auto; }

    /* ---------- Right-side page TOC ---------- */
    .rtoc {
      position: fixed; top: 0; right: 0; width: var(--toc-w); height: 100vh;
      padding: 90px 26px 40px 10px; overflow-y: auto;
      display: none;
    }
    @media (min-width: 1300px) { .rtoc { display: block; } }
    .rtoc-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      color: #96a1b2; margin: 0 0 12px 12px;
    }
    .rtoc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
    .rtoc li { margin: 0; }
    .rtoc a {
      display: block; padding: 5px 12px; margin-left: -1px;
      font-size: 13px; line-height: 1.5; color: #8a94a4; text-decoration: none;
      border-left: 2px solid transparent; transition: all .15s;
    }
    .rtoc a.lvl-3 { padding-left: 24px; font-size: 12.5px; }
    .rtoc a:hover { color: var(--brand); }
    .rtoc a.active { color: var(--brand-dark); font-weight: 700; border-left-color: var(--brand); }

    /* Search box */
    .search { border-bottom: 1px solid var(--line); margin: 0; }
    .search input { border-radius: 9px; background: #f4f7fb; border: 1px solid var(--line); font-size: 14px; }
    .search .results-panel { font-size: 13px; }

    /* Scrollbars */
    .sidebar::-webkit-scrollbar, .rtoc::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb, .rtoc::-webkit-scrollbar-thumb { background: #dfe6ef; border-radius: 8px; }

    @media (max-width: 768px) {
      .markdown-section { padding: 24px 18px 60px; }
    }
  </style>
</head>
<body>
  <div id="app">불러오는 중…</div>
  <aside class="rtoc" id="rtoc"></aside>

  <script>
    window.$docsify = {
      name: '<span style="font-size:20px">🛡️</span> Defender for Cloud',
      loadSidebar: true,
      subMaxLevel: 0,          // 왼쪽 사이드바에는 문서만 (페이지 내부 목차 제외)
      auto2top: true,
      homepage: 'home.md',
      relativePath: true,
      notFoundPage: true,
      coverpage: false,
      search: {
        placeholder: '문서 검색…',
        noData: '결과가 없습니다.',
        depth: 4
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') { return '<div class="mermaid">' + code + '</div>'; }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        // 1) GitHub-style > [!NOTE] callouts
        function (hook) {
          hook.beforeEach(function (content) {
            var map = { NOTE:'note', TIP:'tip', IMPORTANT:'important', WARNING:'warning', CAUTION:'caution' };
            var labels = { note:'📘 참고', tip:'💡 팁', important:'❗ 중요', warning:'⚠️ 경고', caution:'🔺 주의' };
            var lines = content.split('\n'), out = [], i = 0;
            while (i < lines.length) {
              var m = lines[i].match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/i);
              if (m) {
                var kind = map[m[1].toUpperCase()], body = [];
                i++;
                while (i < lines.length && /^>/.test(lines[i])) { body.push(lines[i].replace(/^>\s?/, '')); i++; }
                out.push('<div class="alert ' + kind + '"><span class="label">' + labels[kind] + '</span>\n\n' + body.join('\n') + '\n\n</div>\n');
              } else { out.push(lines[i]); i++; }
            }
            return out.join('\n');
          });
        },
        // 2) Mermaid render
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              try {
                var nodes = document.querySelectorAll('.mermaid:not([data-processed])');
                if (nodes.length) { window.mermaid.run({ nodes: nodes }); }
              } catch (e) { console.warn('mermaid', e); }
            }
          });
        },
        // 3) Right-side page TOC + scroll-spy
        function (hook) {
          var spy = null;
          hook.doneEach(function () {
            var rtoc = document.getElementById('rtoc');
            var section = document.querySelector('.markdown-section');
            if (!rtoc || !section) return;
            var hs = section.querySelectorAll('h2, h3');
            if (!hs.length) { rtoc.innerHTML = ''; return; }
            var html = '<div class="rtoc-title">이 페이지</div><ul>';
            var items = [];
            hs.forEach(function (h) {
              if (!h.id) return;
              var lvl = h.tagName === 'H3' ? 3 : 2;
              var text = (h.textContent || '').replace(/\s*#\s*$/, '').trim();
              html += '<li><a class="lvl-' + lvl + '" href="#' + h.id + '" data-id="' + h.id + '">' + text + '</a></li>';
              items.push(h);
            });
            html += '</ul>';
            rtoc.innerHTML = html;

            rtoc.querySelectorAll('a').forEach(function (a) {
              a.addEventListener('click', function (e) {
                e.preventDefault();
                var el = document.getElementById(a.getAttribute('data-id'));
                if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
              });
            });

            if (spy) spy.disconnect();
            var links = {};
            rtoc.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('data-id')] = a; });
            spy = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (en.isIntersecting) {
                  Object.values(links).forEach(function (l) { l.classList.remove('active'); });
                  var active = links[en.target.id];
                  if (active) active.classList.add('active');
                }
              });
            }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
            items.forEach(function (h) { spy.observe(h); });
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' }, themeVariables: { primaryColor: '#eaf3fc', primaryBorderColor: '#0f6cbd', lineColor: '#8aa0b6', fontFamily: 'Pretendard, sans-serif' } });
    }
  </script>
</body>
</html>
