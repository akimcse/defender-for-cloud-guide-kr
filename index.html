<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Microsoft Defender for Cloud 가이드</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Microsoft Defender for Cloud 학습 코스 — CSPM · CWP · DevSecOps 개념부터 로그 통합·알림 자동화까지. Microsoft Learn 공식 문서 기반." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #0f6cbd;   /* docsify 기본 초록 → 브랜드 블루로 덮기 */
      --brand: #0f6cbd;          /* Fluent primary */
      --brand-dark: #0a4f8f;
      --brand-2: #7b61ff;
      --ink: #1b1f27;
      --ink-soft: #4a5464;
      --line: #e7ecf3;
      --line-soft: #eef2f7;
      --bg: #fbfcfe;
      --bg-code: #f5f7fb;
      --sidebar-w: 290px;
      --toc-w: 250px;
      --radius: 12px;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    /* ---------- Left sidebar (documents only) ---------- */
    .sidebar {
      width: var(--sidebar-w);
      background: #ffffff;
      border-right: 1px solid var(--line);
      padding: 0;
    }
    .sidebar > h1 { margin: 0; padding: 20px 20px 14px; border-bottom: 1px solid var(--line-soft); }
    .sidebar > h1 .app-name-link {
      font-size: 16.5px; font-weight: 800; color: var(--ink);
      display: flex; align-items: center; gap: 9px; letter-spacing: -0.02em;
      cursor: pointer; transition: color .12s;
    }
    .sidebar > h1 .app-name-link:hover { color: var(--brand); }
    .sidebar > h1 .app-name-link img { vertical-align: middle; }
    .sidebar-nav { padding: 10px 12px 40px; }
    .sidebar-nav > ul > li strong,
    .sidebar-nav > ul > li > p strong {
      display: block;
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #96a1b2;
      padding: 12px 10px 3px;
    }
    /* first group label sits flush at top now that Home item is removed */
    .sidebar-nav > ul > li:first-child strong { padding-top: 4px; }
    .sidebar-nav ul { list-style: none; margin: 0; padding: 0; }
    .sidebar-nav li { margin: 1px 0; }
    /* leaf items: link + time badge on one row */
    .sidebar-nav li:has(> a) {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding-right: 10px; border-radius: 8px; flex-wrap: wrap;
    }
    /* nested sub-list (e.g. CWP → Servers) wraps to its own row, indented */
    .sidebar-nav li > ul {
      flex-basis: 100%; width: 100%; margin: 2px 0 4px; padding-left: 12px;
      border-left: 1px solid var(--line-soft); margin-left: 6px;
    }
    .sidebar-nav li > ul li:has(> a) { padding-right: 6px; }
    .sidebar-nav li > ul li a { font-size: 12.5px; padding: 4px 10px; color: #7a8698; }
    html[data-theme="dark"] .sidebar-nav li > ul { border-left-color: #2a323d; }
    .sidebar-nav li:has(> a):hover { background: #f1f6fc; }
    .sidebar-nav li.active:has(> a) { background: linear-gradient(90deg, #eaf3fc, #f3eefe); }
    .sidebar-nav a {
      flex: 1 1 auto; min-width: 0;
      display: block; padding: 5px 10px; border-radius: 8px;
      color: var(--ink-soft); font-size: 13.5px; font-weight: 500;
      text-decoration: none; transition: color .12s ease; border: 0; outline: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-nav li:has(> a):hover a { color: var(--brand); background: transparent; }
    .sidebar-nav a:focus { outline: none; }
    .sidebar-nav li.active > a {
      color: var(--brand-dark); font-weight: 700; background: transparent;
      border: 0 !important; box-shadow: none !important; outline: none !important;
    }
    /* docsify 기본 테마의 활성 항목 테두리·아웃라인 완전 제거 */
    .sidebar-nav a, .sidebar-nav a:hover, .sidebar-nav a:focus, .sidebar-nav a:active,
    .sidebar-nav li > a, .sidebar-nav li.active > a {
      border: 0 !important; outline: 0 !important; box-shadow: none !important;
    }
    /* reading-time badge (sibling of link, right-aligned) */
    .sidebar-nav .t {
      flex: none; font-size: 10.5px; font-weight: 600; color: #a3adbb;
      background: #f0f3f8; border-radius: 20px; padding: 1px 7px;
    }
    .sidebar-nav li.active .t { color: var(--brand); background: #e3eefb; }
    .sidebar-nav li:has(> a):hover .t { color: var(--brand); }
    /* dim the "예정" placeholders */
    .sidebar-nav li em { color: #b3bccb; font-style: normal; font-size: 12px; }
    .app-name { margin: 0; }

    /* ---------- Content ---------- */
    .content { left: var(--sidebar-w); right: 0; transition: left .25s, right .25s; }
    .markdown-section {
      max-width: 820px; margin: 0 auto; padding: 34px 44px 80px;
    }
    /* Wide screens: reserve right space for the page TOC so nothing overlaps */
    @media (min-width: 1300px) {
      .content { right: var(--toc-w); }
    }

    .markdown-section h1 {
      font-size: 30px; font-weight: 800; margin: 8px 0 22px;
      letter-spacing: -0.03em; line-height: 1.25;
      padding-bottom: 16px; border-bottom: 1px solid var(--line);
    }
    .markdown-section h2 {
      font-size: 22px; font-weight: 800; margin: 46px 0 16px;
      color: var(--ink); letter-spacing: -0.02em;
      padding-bottom: 10px; border-bottom: 2px solid var(--line);
    }
    .markdown-section h2::after {
      content: ""; display: block; width: 46px; height: 3px; margin-top: 10px;
      margin-bottom: -12px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); border-radius: 3px;
    }
    .markdown-section h3 {
      font-size: 16.5px; font-weight: 700; margin: 28px 0 10px; color: var(--brand-dark);
    }
    /* docsify wraps heading text in <a class="anchor"><span>…</span></a> and the vue
       theme colors that span directly — force it to inherit our heading color */
    .markdown-section h1 a, .markdown-section h1 a span,
    .markdown-section h2 a, .markdown-section h2 a span,
    .markdown-section h3 a, .markdown-section h3 a span,
    .markdown-section h4 a, .markdown-section h4 a span {
      color: inherit !important;
      -webkit-text-fill-color: currentColor !important;
    }
    .markdown-section p, .markdown-section li { line-height: 1.75; color: #2b3542; }
    .markdown-section a { color: var(--brand); text-decoration: none; border-bottom: 1px solid transparent; }
    .markdown-section a:hover { border-bottom-color: var(--brand); }

    /* Tables */
    .markdown-section table {
      display: table; width: 100%; border-collapse: separate; border-spacing: 0;
      margin: 18px 0; border: 1px solid var(--line); border-radius: var(--radius);
      overflow: hidden; font-size: 14px;
    }
    .markdown-section th {
      background: #f3f7fc; color: #33465c; font-weight: 700;
      text-align: left; border: 0; border-bottom: 1px solid var(--line);
    }
    /* respect markdown column alignment (| :-- | --: |) on header cells */
    .markdown-section th[align="right"] { text-align: right; }
    .markdown-section th[align="center"] { text-align: center; }
    .markdown-section th[align="left"] { text-align: left; }
    .markdown-section td { border: 0; border-bottom: 1px solid var(--line-soft); }
    .markdown-section tr:last-child td { border-bottom: 0; }
    .markdown-section tbody tr:nth-child(2n) { background: #fafcfe; }
    .markdown-section th, .markdown-section td { padding: 10px 14px; }

    /* Code */
    .markdown-section code { color: #b23a86; background: var(--bg-code); border-radius: 5px; padding: 2px 6px; font-size: 13px; }
    .markdown-section pre { background: var(--bg-code); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
    .markdown-section pre > code { background: transparent; color: #2b3542; }

    /* Blockquote (plain) */
    .markdown-section blockquote {
      border-left: 3px solid #cdd7e3; background: #f8fafc;
      color: #55617180; color: #556171; margin: 16px 0; padding: 6px 18px; border-radius: 0 8px 8px 0;
    }
    .markdown-section blockquote p { color: #556171; }

    /* Screenshots / images */
    .markdown-section img {
      max-width: 100%; height: auto; display: block;
      border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 2px 10px rgba(20,40,80,.06); margin: 14px 0 4px;
    }
    html[data-theme="dark"] .markdown-section img {
      border-color: #2a323d; box-shadow: 0 2px 12px rgba(0,0,0,.35);
    }
    /* image caption */
    .markdown-section small.cap {
      display: block; font-size: 12px; line-height: 1.5; color: #97a2b0;
      margin: 3px 0 14px; padding-left: 2px;
    }
    html[data-theme="dark"] .markdown-section small.cap { color: #7d8896; }

    /* ---------- feature cards ---------- */
    .markdown-section .cardgrid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px; margin: 16px 0 8px;
    }
    .markdown-section .card {
      border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px 15px;
      background: #fff; box-shadow: 0 1px 3px rgba(20,40,80,.045);
      transition: box-shadow .15s ease, transform .15s ease;
    }
    .markdown-section .card:hover { box-shadow: 0 6px 20px rgba(20,40,80,.10); transform: translateY(-2px); }
    .markdown-section .card .ic {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px; border-radius: 10px;
      background: #eef6fc; font-size: 20px; line-height: 1;
    }
    .markdown-section .card h4 {
      margin: 10px 0 6px; font-size: 15px; font-weight: 800;
      color: var(--ink); letter-spacing: -0.01em;
    }
    .markdown-section .card h4 .sub { font-weight: 600; font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
    .markdown-section .card p { margin: 0; font-size: 13.5px; line-height: 1.62; color: var(--ink-soft); }
    .markdown-section .card p b, .markdown-section .card p strong { color: var(--ink); font-weight: 700; }
    html[data-theme="dark"] .markdown-section .card { background: #1b212b; border-color: #2a323d; box-shadow: none; }
    html[data-theme="dark"] .markdown-section .card:hover { box-shadow: 0 6px 20px rgba(0,0,0,.42); }
    html[data-theme="dark"] .markdown-section .card .ic { background: #12202e; }

    /* ---------- GitHub-style callouts ---------- */
    .alert { border: 1px solid; border-left-width: 4px; border-radius: 10px; padding: 14px 18px; margin: 18px 0; }
    .alert p:first-child { margin-top: 0; }
    .alert p:last-child { margin-bottom: 0; }
    .alert .label { font-weight: 800; font-size: 13px; letter-spacing: -0.01em; margin-bottom: 6px; display: block; }
    .alert.note { border-color: #b6d8f5; background: #eff6fc; }
    .alert.note .label { color: #0f6cbd; }
    .alert.tip { border-color: #b6e3c4; background: #eefaf1; }
    .alert.tip .label { color: #1a7f37; }
    .alert.important { border-color: #d6c6ff; background: #f4efff; }
    .alert.important .label { color: #6b3ff0; }
    .alert.warning { border-color: #f2d9a6; background: #fff8ea; }
    .alert.warning .label { color: #9a6700; }
    .alert.caution { border-color: #f5b9be; background: #fdeef0; }
    .alert.caution .label { color: #cf222e; }

    /* status badges */
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px; }
    .badge.ga { background:#e4f5e9; color:#1a7f37; }
    .badge.preview { background:#fff0d4; color:#8a5a00; }

    /* Mermaid */
    .mermaid { text-align: center; margin: 22px 0; }
    .mermaid svg { max-width: 100%; height: auto; }

    /* ---------- Right-side page TOC ---------- */
    .rtoc {
      position: fixed; top: 0; right: 0; width: var(--toc-w); height: 100vh;
      padding: 90px 26px 40px 10px; overflow-y: auto;
      display: none;
    }
    @media (min-width: 1300px) { .rtoc { display: block; } }
    .rtoc-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em;
      color: #96a1b2; margin: 0 0 12px 12px;
    }
    .rtoc ul { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); }
    .rtoc li { margin: 0; }
    .rtoc a {
      display: block; padding: 5px 12px; margin-left: -1px;
      font-size: 13px; line-height: 1.5; color: #8a94a4; text-decoration: none;
      border-left: 2px solid transparent; transition: all .15s;
    }
    .rtoc a.lvl-3 { padding-left: 24px; font-size: 12.5px; }
    .rtoc a:hover { color: var(--brand); }
    .rtoc a.active { color: var(--brand-dark); font-weight: 700; border-left-color: var(--brand); }

    /* Search box + results */
    .search { border-bottom: 1px solid var(--line); margin: 0; padding: 14px 16px; }
    .search .input-wrap { margin: 0; }
    .search input {
      border-radius: 10px; background: #f4f7fb; border: 1px solid var(--line);
      font-size: 14px; padding: 9px 12px; transition: border-color .15s, background .15s;
    }
    .search input:focus { background: #fff; border-color: var(--brand); outline: none; }
    .search .clear-button { cursor: pointer; }
    .search .results-panel { font-size: 13px; }
    .search .matching-post {
      border: 0; border-bottom: 1px solid var(--line-soft);
      padding: 12px 16px; transition: background .12s;
    }
    .search .matching-post:last-child { border-bottom: 0; }
    .search .matching-post:hover { background: #f4f8fd; }
    .search p.matching-post { border: 0; color: #8a94a4; }
    .search .matching-post h2 {
      font-size: 13.5px; font-weight: 700; color: var(--ink);
      margin: 0 0 4px; letter-spacing: -0.01em; line-height: 1.35;
    }
    .search .matching-post p {
      font-size: 12px; color: #6b7686; margin: 0; line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .search .search-keyword {
      color: var(--brand-dark); background: #e3eefb; font-style: normal;
      border-radius: 3px; padding: 0 3px; font-weight: 600;
    }
    .sidebar-nav > ul > li:first-child:hover { background: transparent; }

    /* Scrollbars */
    .sidebar::-webkit-scrollbar, .rtoc::-webkit-scrollbar { width: 8px; }
    .sidebar::-webkit-scrollbar-thumb, .rtoc::-webkit-scrollbar-thumb { background: #dfe6ef; border-radius: 8px; }

    @media (max-width: 768px) {
      .markdown-section { padding: 24px 18px 60px; }
    }

    /* ============ Dark mode ============ */
    html[data-theme="dark"] {
      --brand: #57aef0;
      --brand-dark: #8ecbf5;
      --brand-2: #b39dff;
      --ink: #eef2f8;
      --ink-soft: #b9c3d0;
      --line: #2a323d;
      --line-soft: #232a34;
      --bg: #12171f;
      --bg-code: #1a212b;
    }
    html[data-theme="dark"] body { background: var(--bg); color: var(--ink); }
    html[data-theme="dark"] .sidebar { background: #131922; border-right-color: var(--line); }
    html[data-theme="dark"] .sidebar > h1 { border-bottom-color: var(--line); }
    html[data-theme="dark"] .sidebar > h1 .app-name-link { color: var(--ink); }
    html[data-theme="dark"] .sidebar-nav li:has(> a):hover { background: #1a212b; }
    html[data-theme="dark"] .sidebar-nav li.active:has(> a) { background: linear-gradient(90deg,#182636,#211d33); }
    html[data-theme="dark"] .sidebar-nav .t { background: #222b36; color: #8c99a8; }
    html[data-theme="dark"] .sidebar-nav li.active .t { background: #1d3247; color: var(--brand-dark); }
    html[data-theme="dark"] .markdown-section h1 { border-bottom-color: var(--line); }
    html[data-theme="dark"] .markdown-section h2 { border-bottom-color: var(--line); }
    html[data-theme="dark"] .markdown-section p,
    html[data-theme="dark"] .markdown-section li { color: #dbe2ec; }
    html[data-theme="dark"] .markdown-section strong { color: #ffffff; }
    html[data-theme="dark"] .markdown-section h3 { color: var(--brand-dark); }
    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h2 { color: #f4f7fb; }
    html[data-theme="dark"] .markdown-section td { color: #dbe2ec; }
    html[data-theme="dark"] .alert p:first-child { color: inherit; }
    html[data-theme="dark"] .alert p, html[data-theme="dark"] .alert li { color: #e4e9f0; }
    /* docsify mobile sidebar toggle bar */
    html[data-theme="dark"] .sidebar-toggle { background: #131922; border-color: var(--line); }
    html[data-theme="dark"] .sidebar-toggle .sidebar-toggle-button span { background: var(--ink-soft); }
    html[data-theme="dark"] .markdown-section table { border-color: var(--line); }
    html[data-theme="dark"] .markdown-section th { background: #1a212b; color: #cdd6e0; border-bottom-color: var(--line); }
    html[data-theme="dark"] .markdown-section td { border-bottom-color: var(--line-soft); }
    html[data-theme="dark"] .markdown-section tbody tr:nth-child(2n) { background: #141a22; }
    html[data-theme="dark"] .markdown-section code { background: var(--bg-code); color: #ff9ecb; }
    html[data-theme="dark"] .markdown-section pre { background: var(--bg-code); border-color: var(--line); }
    html[data-theme="dark"] .markdown-section pre > code { color: #d4dbe4; }
    html[data-theme="dark"] .markdown-section blockquote { background: #171e27; border-left-color: #3a4757; }
    html[data-theme="dark"] .markdown-section blockquote p { color: #b3bdc9; }
    /* callouts (dark) */
    html[data-theme="dark"] .alert.note { border-color: #2b5378; background: #12202e; }
    html[data-theme="dark"] .alert.note .label { color: #5aa9e6; }
    html[data-theme="dark"] .alert.tip { border-color: #2f5e3f; background: #122117; }
    html[data-theme="dark"] .alert.tip .label { color: #57bd78; }
    html[data-theme="dark"] .alert.important { border-color: #4a3a7a; background: #1a1730; }
    html[data-theme="dark"] .alert.important .label { color: #a48bff; }
    html[data-theme="dark"] .alert.warning { border-color: #6b5320; background: #221c10; }
    html[data-theme="dark"] .alert.warning .label { color: #d6a53d; }
    html[data-theme="dark"] .alert.caution { border-color: #6e2f36; background: #241318; }
    html[data-theme="dark"] .alert.caution .label { color: #f2727e; }
    /* search (dark) */
    html[data-theme="dark"] .search { border-bottom-color: var(--line); }
    html[data-theme="dark"] .search input { background: #1a212b; border-color: var(--line); color: var(--ink); }
    html[data-theme="dark"] .search input:focus { background: #10161d; border-color: var(--brand); }
    html[data-theme="dark"] .search .matching-post { border-bottom-color: var(--line-soft); }
    html[data-theme="dark"] .search .matching-post:hover { background: #182029; }
    html[data-theme="dark"] .search .matching-post h2 { color: var(--ink); }
    html[data-theme="dark"] .search .matching-post p { color: #97a2b0; }
    html[data-theme="dark"] .search .search-keyword { background: #1d3247; color: #7cc0f0; }
    /* badges (dark) */
    html[data-theme="dark"] .badge.ga { background: #143021; color: #6bce8b; }
    html[data-theme="dark"] .badge.preview { background: #33280d; color: #e0b155; }
    /* right toc (dark) */
    html[data-theme="dark"] .rtoc ul { border-left-color: var(--line); }
    html[data-theme="dark"] .rtoc a { color: #7d8896; }
    html[data-theme="dark"] .rtoc a.active { color: var(--brand-dark); border-left-color: var(--brand); }
    /* mermaid stays on a light card for readability */
    html[data-theme="dark"] .mermaid { background: #eef2f7; border-radius: 12px; padding: 14px; }
    html[data-theme="dark"] .sidebar::-webkit-scrollbar-thumb,
    html[data-theme="dark"] .rtoc::-webkit-scrollbar-thumb { background: #2c3541; }

    /* ---- Dark: force-override docsify vue theme's dark text colors ---- */
    html[data-theme="dark"] .sidebar-nav a,
    html[data-theme="dark"] .sidebar ul li a { color: #ccd5e0 !important; }
    html[data-theme="dark"] .sidebar-nav li.active > a,
    html[data-theme="dark"] .sidebar ul li.active > a { color: var(--brand-dark) !important; }
    html[data-theme="dark"] .markdown-section h1,
    html[data-theme="dark"] .markdown-section h1 a,
    html[data-theme="dark"] .markdown-section h2,
    html[data-theme="dark"] .markdown-section h2 a { color: #f4f7fb !important; }
    html[data-theme="dark"] .markdown-section h3,
    html[data-theme="dark"] .markdown-section h3 a { color: #cfe4fb !important; }
    html[data-theme="dark"] .rtoc a { color: #aeb9c7 !important; }
    html[data-theme="dark"] .rtoc a.active { color: #dcebfb !important; }
    html[data-theme="dark"] .rtoc-title { color: #8b97a6 !important; }
    html[data-theme="dark"] .sidebar-nav > ul > li strong { color: #8b97a6 !important; }

    /* ============ Theme toggle button ============ */
    #theme-toggle {
      position: fixed; top: 14px; right: 18px; z-index: 60;
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--line); background: #ffffff; color: var(--ink-soft);
      font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(20,40,80,.08); transition: all .15s;
    }
    #theme-toggle:hover { color: var(--brand); border-color: var(--brand); }
    html[data-theme="dark"] #theme-toggle { background: #1a212b; border-color: var(--line); }
    @media (max-width: 768px) { #theme-toggle { top: auto; bottom: 16px; } }
  </style>
</head>
<body>
  <button id="theme-toggle" title="라이트/다크 모드 전환" aria-label="테마 전환">🌙</button>
  <div id="app">불러오는 중…</div>
  <aside class="rtoc" id="rtoc"></aside>

  <script>
    // Dark mode: restore preference before render to avoid flash
    (function () {
      var saved = localStorage.getItem('dfc-theme');
      var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      function paintBtn() {
        var b = document.getElementById('theme-toggle');
        if (b) b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }
      document.addEventListener('DOMContentLoaded', function () {
        paintBtn();
        var b = document.getElementById('theme-toggle');
        if (b) b.addEventListener('click', function () {
          var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('dfc-theme', next);
          paintBtn();
        });
      });
    })();
  </script>

  <script>
    window.$docsify = {
      name: '<span style="font-size:20px">🛡️</span> Defender for Cloud',
      loadSidebar: true,
      subMaxLevel: 0,          // 왼쪽 사이드바에는 문서만 (페이지 내부 목차 제외)
      auto2top: true,
      homepage: 'home.md',
      relativePath: true,
      notFoundPage: true,
      coverpage: false,
      search: {
        placeholder: '문서 검색…',
        noData: '결과가 없습니다.',
        depth: 4
      },
      markdown: {
        renderer: {
          code: function (code, lang) {
            if (lang === 'mermaid') { return '<div class="mermaid">' + code + '</div>'; }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        // 1) GitHub-style > [!NOTE] callouts
        function (hook) {
          hook.beforeEach(function (content) {
            var map = { NOTE:'note', TIP:'tip', IMPORTANT:'important', WARNING:'warning', CAUTION:'caution' };
            var labels = { note:'📘 참고', tip:'💡 팁', important:'❗ 중요', warning:'⚠️ 경고', caution:'🔺 주의' };
            var lines = content.split('\n'), out = [], i = 0;
            while (i < lines.length) {
              var m = lines[i].match(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/i);
              if (m) {
                var kind = map[m[1].toUpperCase()], body = [];
                i++;
                while (i < lines.length && /^>/.test(lines[i])) { body.push(lines[i].replace(/^>\s?/, '')); i++; }
                out.push('<div class="alert ' + kind + '"><span class="label">' + labels[kind] + '</span>\n\n' + body.join('\n') + '\n\n</div>\n');
              } else { out.push(lines[i]); i++; }
            }
            return out.join('\n');
          });
        },
        // 2) Mermaid render
        function (hook) {
          hook.doneEach(function () {
            if (window.mermaid) {
              try {
                var nodes = document.querySelectorAll('.mermaid:not([data-processed])');
                if (nodes.length) { window.mermaid.run({ nodes: nodes }); }
              } catch (e) { console.warn('mermaid', e); }
            }
          });
        },
        // 3) Right-side page TOC + scroll-spy
        function (hook) {
          var spy = null;
          hook.doneEach(function () {
            var rtoc = document.getElementById('rtoc');
            var section = document.querySelector('.markdown-section');
            if (!rtoc || !section) return;
            var hs = section.querySelectorAll('h2, h3');
            if (!hs.length) { rtoc.innerHTML = ''; return; }
            var html = '<div class="rtoc-title">이 페이지</div><ul>';
            var items = [];
            hs.forEach(function (h) {
              if (!h.id) return;
              var lvl = h.tagName === 'H3' ? 3 : 2;
              var text = (h.textContent || '').replace(/\s*#\s*$/, '').trim();
              html += '<li><a class="lvl-' + lvl + '" href="#' + h.id + '" data-id="' + h.id + '">' + text + '</a></li>';
              items.push(h);
            });
            html += '</ul>';
            rtoc.innerHTML = html;

            rtoc.querySelectorAll('a').forEach(function (a) {
              a.addEventListener('click', function (e) {
                e.preventDefault();
                var el = document.getElementById(a.getAttribute('data-id'));
                if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
              });
            });

            if (spy) spy.disconnect();
            var links = {};
            rtoc.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('data-id')] = a; });
            spy = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (en.isIntersecting) {
                  Object.values(links).forEach(function (l) { l.classList.remove('active'); });
                  var active = links[en.target.id];
                  if (active) active.classList.add('active');
                }
              });
            }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
            items.forEach(function (h) { spy.observe(h); });
          });
        },
        // 4) Browser tab title — always "<페이지> — Defender for Cloud 가이드"
        function (hook, vm) {
          hook.doneEach(function () {
            var site = 'Microsoft Defender for Cloud 가이드';
            var h1 = document.querySelector('.markdown-section h1');
            var t = h1 ? (h1.textContent || '').replace(/\s*#\s*$/, '').trim() : '';
            var hash = (window.location.hash || '').replace(/^#/, '');
            var isHome = (hash === '' || hash === '/' || hash === '/README' || hash === '/home');
            if (!t) {
              document.title = site;
            } else if (isHome) {
              document.title = t;              // 홈: 전체 문서 제목만
            } else {
              document.title = t + ' — ' + site;
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' }, themeVariables: { primaryColor: '#eaf3fc', primaryBorderColor: '#0f6cbd', lineColor: '#8aa0b6', fontFamily: 'Pretendard, sans-serif' } });
    }
  </script>
</body>
</html>
